name: Add Claude Code Linux x64 2.1.247

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-claude-code-2.1.247.yml

permissions:
  contents: write

jobs:
  add-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official npm package
        run: npm pack @anthropic-ai/claude-code-linux-x64@2.1.247 --pack-destination claude_linux_version

      - name: Verify package checksum
        run: echo "c6697aa74f8f6c0a1167fcf800ca976b34b89c0170dead133aead97b1ed18471  claude_linux_version/anthropic-ai-claude-code-linux-x64-2.1.247.tgz" | sha256sum --check

      - name: Commit package and remove workflow
        run: |
          rm .github/workflows/add-claude-code-2.1.247.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude_linux_version/anthropic-ai-claude-code-linux-x64-2.1.247.tgz
          git add .github/workflows/add-claude-code-2.1.247.yml
          git commit -m "Add Claude Code Linux x64 2.1.247"
          git push

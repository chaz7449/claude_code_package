name: Add Cognee v1.5.3 archive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-cognee-v1.5.3.yml

permissions:
  contents: write

jobs:
  add-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            cognee
          sparse-checkout-cone-mode: true

      - name: Download Cognee v1.5.3
        run: |
          mkdir -p cognee
          curl --fail --location --retry 3 \
            --output cognee/cognee-v1.5.3.zip \
            https://github.com/topoteretes/cognee/archive/refs/tags/v1.5.3.zip
          unzip -tq cognee/cognee-v1.5.3.zip

      - name: Verify archive checksum
        run: echo "d758e9fef65e92bbd0ccfc575f191339b471cc89b9002071d7200822fac10206  cognee/cognee-v1.5.3.zip" | sha256sum --check

      - name: Commit archive and remove workflow
        run: |
          rm .github/workflows/add-cognee-v1.5.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognee/cognee-v1.5.3.zip
          git add .github/workflows/add-cognee-v1.5.3.yml
          git commit -m "Add Cognee v1.5.3 source archive"
          git push

name: Add Cognee source archive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-cognee-archive.yml

permissions:
  contents: write

jobs:
  add-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            cognee
          sparse-checkout-cone-mode: true

      - name: Download pinned Cognee source archive
        run: |
          mkdir -p cognee
          curl --fail --location --retry 3 \
            --output cognee/cognee-main.zip \
            https://github.com/topoteretes/cognee/archive/690c0ec023719a2a277dc893cdecfec1ca8012cc.zip
          unzip -t cognee/cognee-main.zip

      - name: Commit archive and remove workflow
        run: |
          rm .github/workflows/add-cognee-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognee/cognee-main.zip
          git add .github/workflows/add-cognee-archive.yml
          git commit -m "Add Cognee source archive at 690c0ec"
          git push

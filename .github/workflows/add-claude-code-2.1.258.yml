name: Add Claude Code Linux x64 2.1.258

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-claude-code-2.1.258.yml

permissions:
  contents: write

jobs:
  add-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            claude_linux_version
          sparse-checkout-cone-mode: true

      - name: Download official npm package
        run: npm pack @anthropic-ai/claude-code-linux-x64@2.1.258 --pack-destination claude_linux_version

      - name: Verify package checksum
        run: echo "037f8a21ae74a29b613f02cd3986cefb0b00fcb14f957a8dab98dc2e3f3fd753  claude_linux_version/anthropic-ai-claude-code-linux-x64-2.1.258.tgz" | sha256sum --check

      - name: Commit package and remove workflow
        run: |
          rm .github/workflows/add-claude-code-2.1.258.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude_linux_version/anthropic-ai-claude-code-linux-x64-2.1.258.tgz
          git add .github/workflows/add-claude-code-2.1.258.yml
          git commit -m "Add Claude Code Linux x64 2.1.258"
          git push
